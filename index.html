<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Border Targeting Centre Brief</title>
<style>
  :root {
    color-scheme: light;
    --forest:#1F3A2E; --forest-dark:#142922; --forest-pale:#E7EEE8;
    --gold:#F49A1E; --gold-light:#F7B24E;
    --terracotta:#B5482A; --amber:#D9943B; --leaf:#3F7D52; --teal:#2E6E72;
    --cream:#F8F7F5; --sand:#EFE8D8; --ink:#262626; --text2:#5B5648; --muted:#928d80;
    --border:#e0dcd2; --brown:#543A09; --taupe:#927C5A; --err:#a23b3b;
    --bg:#F3F1EC; --card:#ffffff;
    --c-a:#2E6E72; --c-a-bg:#E1EDEE;
    --c-b:#3F7D52; --c-b-bg:#E2EFE3;
    --c-c:#B5482A; --c-c-bg:#F7E2DA;
    --c-d:#1E5A7A; --c-d-bg:#E1EBF1;
    --c-e:#8A5A1F; --c-e-bg:#F3E8D6;
    --c-news:#4a4f57; --c-news-bg:#eeeef0;
    --c-x:#6B3FA0; --c-x-bg:#efe8f7;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:14px; line-height:1.5;
    background-image:radial-gradient(circle at 1px 1px, rgba(31,58,46,0.05) 1px, transparent 0); background-size:22px 22px; }
  h1,h2,h3,.serif { font-family:'Fraunces','Georgia','Times New Roman',serif; }
  .wrap { max-width:1300px; margin:0 auto; padding:0 16px 46px; }
  a { color:#1E5A7A; }
  svg.icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; vertical-align:-3px; }

  .header { position:relative; overflow:hidden; background:linear-gradient(155deg,var(--forest) 0%,var(--forest-dark) 100%);
    color:#fff; padding:20px 26px; margin:0 0 14px; border-radius:0 0 16px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; }
  .header::before { content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:radial-gradient(rgba(244,154,30,0.35) 1px, transparent 1.4px); background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse 480px 220px at 12% 40%, #000 0%, transparent 75%);
    mask-image:radial-gradient(ellipse 480px 220px at 12% 40%, #000 0%, transparent 75%); }
  .header-brand { display:flex; align-items:center; gap:15px; position:relative; z-index:1; }
  .header-brand .mark { width:66px; height:60px; border-radius:12px; flex:none; padding:5px; background:#fff; border:1px solid rgba(244,154,30,0.55);
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.28); }
  .header-brand .mark img { width:100%; height:100%; object-fit:contain; display:block; }
  .header-brand h1 { font-size:22px; margin:0; font-weight:600; letter-spacing:0.3px; line-height:1.15; }
  .header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:relative; z-index:1; }
  .header-meta { font-size:12px; color:#c6d2c8; text-align:right; }
  #lastRefreshedLine { color:var(--gold-light); margin-top:2px; }

  .btn-primary { background:var(--gold); color:#241a06; border:none; border-radius:8px; padding:9px 15px; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit; }
  .btn-primary:hover { background:var(--gold-light); }
  .btn-primary:disabled { opacity:.6; cursor:default; }
  .btn-secondary { background:#fff; color:var(--forest); border:1px solid var(--border); border-radius:8px; padding:8px 13px; font-weight:600; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .btn-secondary:hover { border-color:var(--taupe); }
  .btn-link { background:none; border:none; color:var(--teal); cursor:pointer; font-size:12px; font-weight:600; padding:0; font-family:inherit; }
  .spin { animation:spin 1s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }

  .disclaimer { font-size:11px; color:var(--muted); margin:0 0 12px; letter-spacing:.2px; }
  .refresh-status { font-size:12.5px; padding:0; height:0; overflow:hidden; transition:all .2s; }
  .refresh-status.show { padding:9px 13px; height:auto; border-radius:8px; margin-bottom:12px; }
  .refresh-status.info { background:var(--teal-pale,#E1EDEE); color:#1c4a4d; border:1px solid #bcd7d8; }
  .refresh-status.err { background:#f7e6e2; color:#7d2f1c; border:1px solid #e6b5a8; }

  .tabbar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
  .tab { display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; font-size:13px; color:var(--forest); font-family:inherit; }
  .tab:hover { border-color:var(--gold); }
  .tab.active { background:var(--forest); color:#fff; border-color:var(--forest); }
  .tab .cnt { background:var(--gold); color:#241a06; border-radius:20px; padding:1px 8px; font-size:11px; font-weight:800; min-width:20px; text-align:center; }
  .tab.active .cnt { background:var(--gold-light); }
  .tab.special { color:var(--teal); }
  .tab.special.active { background:var(--teal); color:#fff; border-color:var(--teal); }

  .view-head { display:flex; align-items:flex-start; gap:12px; margin:0 0 14px; }
  .view-title { font-family:'Fraunces','Georgia',serif; font-size:20px; font-weight:600; color:var(--forest); margin:0; }
  .view-sub { font-size:12px; color:var(--text2); margin-top:3px; }
  .ref-chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
  .chip-ref { font-size:10.5px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:3px 10px; color:var(--text2); }

  .article-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:820px){ .article-grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--taupe); border-radius:9px; padding:11px 12px; }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; border-radius:5px; padding:2px 7px; display:inline-block; }
  .sub-tag { font-size:10px; font-weight:600; color:var(--text2); background:#f1efe9; border:1px solid var(--border); border-radius:5px; padding:2px 7px; margin-left:5px; }
  .new-badge { font-size:9px; font-weight:800; color:#fff; background:var(--gold); border-radius:4px; padding:2px 5px; margin-left:6px; letter-spacing:.5px; }
  .headline { font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.35; margin:2px 0 4px; }
  .note { font-size:12.5px; color:#3a3a34; margin-top:5px; line-height:1.5; }
  .meta-line { font-size:11px; color:var(--muted); margin-top:5px; }
  .btn-icon { background:#fff; border:1px solid var(--border); border-radius:6px; font-size:11px; font-weight:700; color:var(--teal); cursor:pointer; padding:3px 8px; display:inline-flex; align-items:center; gap:4px; flex:none; font-family:inherit; }
  .btn-icon:hover { border-color:var(--teal); }
  .btn-icon.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn-icon svg { width:13px; height:13px; }
  .empty-note { font-size:12.5px; color:var(--muted); font-style:italic; padding:14px 0; }
  .intl-divider { display:flex; align-items:center; gap:10px; margin:18px 0 12px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
  .intl-divider::before,.intl-divider::after { content:''; flex:1; height:1px; background:var(--border); }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .watch-item { border:1px solid var(--border); border-radius:9px; padding:10px 11px; margin-bottom:10px; background:#fcfbf9; }
  .day-badge { font-size:10px; color:var(--muted); }
  .notes-list { margin:6px 0 4px; padding-left:16px; font-size:12px; color:var(--text2); }
  .note-input { display:flex; gap:6px; margin-top:7px; }
  .note-input input { flex:1; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; }
  .row-actions { margin-top:7px; }

  .interest-form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .interest-form input { border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit; }
  .interest-form input.label-in { width:220px; }
  .interest-form input.query-in { flex:1; min-width:220px; }
  .interest-chip { display:inline-flex; align-items:center; gap:8px; background:var(--c-x-bg); color:var(--c-x); border:1px solid #d9c9ef; border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; margin:0 8px 8px 0; }
  .interest-chip button { background:none; border:none; color:var(--c-x); cursor:pointer; font-weight:800; font-size:14px; line-height:1; }

  .terminal { background:var(--forest-dark); border-radius:10px; padding:14px; }
  .terminal input { width:100%; border:1px solid #2f4a3c; border-radius:7px; padding:9px 11px; font-size:13px; background:#0f2018; color:#eaf1ec; font-family:inherit; }
  .terminal input::placeholder { color:#8aa394; }
  .quick-row { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 4px; }
  .quick-btn { font-size:11px; font-weight:600; color:#eaf1ec; background:#1c3a2c; border:1px solid #2f4a3c; border-radius:20px; padding:5px 10px; cursor:pointer; font-family:inherit; }
  .quick-btn:hover { border-color:var(--gold); color:var(--gold-light); }
  .chip-row { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0; }
  .chip { font-size:11px; font-weight:600; color:#cde0d5; background:#16302373; border:1px solid #2f4a3c; border-radius:20px; padding:4px 10px; cursor:pointer; }
  .chip.active { background:var(--gold); color:#241a06; border-color:var(--gold); }
  .terminal-hint { font-size:10.5px; color:#8aa394; margin-top:8px; }
  .assess-card { background:#fff; border:1px solid var(--border); border-left:3px solid var(--forest); border-radius:9px; padding:12px; margin-bottom:10px; }
  .assess-card .q { font-weight:700; font-size:12.5px; color:var(--forest); margin-bottom:7px; }
  .assess-card .body { font-size:12.5px; color:var(--ink); white-space:pre-wrap; line-height:1.55; }
  .assess-card .stamp { font-size:10px; color:var(--muted); margin-top:8px; }
  .assess-card .actions { margin-top:9px; display:flex; gap:7px; flex-wrap:wrap; }

  .modal-overlay { position:fixed; inset:0; background:rgba(20,25,20,0.6); display:none; z-index:200; overflow:auto; padding:24px 16px; }
  .modal-overlay.show { display:block; }
  .doc-wrap { max-width:840px; margin:0 auto; }
  .doc-toolbar { position:sticky; top:0; display:flex; justify-content:flex-end; gap:8px; padding:10px; background:rgba(20,25,20,0.0); }
  .doc-sheet { background:#fff; border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,.4); padding:0 0 40px; overflow:hidden; }
  .footer-note { text-align:center; font-size:12px; color:var(--text2); margin-top:22px; padding-top:16px; border-top:1px solid var(--border); }
  .footer-note .motto { color:var(--forest); font-weight:700; font-family:'Fraunces','Georgia',serif; }
</style>
</head>

  function renderAssess(){

  function requestAssessment(){

      apiPost('/api/assess',{product:state.selectedProduct,query:q,grounding:grounding}).then(function(r){ done((r.ok&&r.data&&r.data.text)?r.data.text:('AI assessment unavailable ('+((r.data&&r.data.error)||('HTTP '+r.status))+').')); }).catch(function(e){ done('Assessment failed: '+(e&&e.message?e.message:e)); });
    } else if(hasCowork()){
      var prompt='You are an intelligence analyst producing a rapid open-source '+state.selectedProduct.toLowerCase()+' for the BMA National Border Targeting Centre. House style: authoritative, plain, direct English, no corporate jargon, no em dashes. Structure: BLUF; Key Judgements (3-5 bullets); Modus Operandi / Drivers; Indicators and Warnings; Intelligence Gaps; Recommended BMA Action. Where relevant apply a 5x5 Likelihood x Consequence rating and state the band. State an explicit confidence level. Under 450 words.\nQuestion: '+q+'\nGrounding from the NBTC Brief:';
      askCowork(prompt,grounding?[grounding]:[]).then(done).catch(function(e){ done('Assessment failed: '+(e&&e.message?e.message:e)); });
    } else { done('Assessments are only available when the app AI is enabled or inside Claude.'); }
  }

  // ---------- document modal ----------
  var currentDocHtml='', currentDocName='assessment';
  function docInnerHtml(a){
    var body=escapeHtml(a.result).replace(/\n/g,'<br>');
    var dt=new Date(a.createdAt).toLocaleString();
    return '<div style="background:#1F3A2E;color:#fff;padding:22px 28px;">'+
        '<div style="font-family:Georgia,serif;font-size:12px;letter-spacing:2px;color:#F7B24E;">BORDER MANAGEMENT AUTHORITY</div>'+
        '<div style="font-family:Georgia,serif;font-size:22px;font-weight:600;margin-top:4px;">'+escapeHtml(a.product)+'</div>'+
        '<div style="font-size:12px;color:#c6d2c8;margin-top:4px;">National Border Targeting Centre &middot; OFFICIAL - Open-source basis</div>'+
      '</div>'+
      '<div style="padding:26px 30px;color:#222;font-family:Calibri,Arial,sans-serif;">'+
        '<table style="font-size:12px;color:#555;margin-bottom:16px;"><tr><td style="padding:2px 18px 2px 0;"><b>Subject</b></td><td>'+escapeHtml(a.query)+'</td></tr>'+
        '<tr><td style="padding:2px 18px 2px 0;"><b>Prepared</b></td><td>'+dt+'</td></tr>'+
        '<tr><td style="padding:2px 18px 2px 0;"><b>Basis</b></td><td>Open-source reporting</td></tr></table>'+
        '<div style="font-size:13.5px;line-height:1.6;">'+body+'</div>'+
        '<div style="margin-top:26px;padding-top:12px;border-top:2px solid #B9975B;font-size:11px;color:#777;">Secure Borders for Development &middot; www.bma.gov.za</div>'+
      '</div>';
  }
  function openDoc(a){
    currentDocName='BMA-'+a.product.replace(/[^a-z0-9]+/gi,'-')+'-'+new Date(a.createdAt).toISOString().slice(0,10);
    var inner=docInnerHtml(a);
    document.getElementById('docSheet').innerHTML=inner;
    currentDocHtml='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+escapeHtml(a.product)+'</title></head><body>'+inner+'</body></html>';
    document.getElementById('docModal').classList.add('show');
  }
  function closeDoc(){ document.getElementById('docModal').classList.remove('show'); }
  function downloadDoc(){ var blob=new Blob(['﻿'+currentDocHtml],{type:'application/msword'}); var el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download=currentDocName+'.doc'; document.body.appendChild(el); el.click(); document.body.removeChild(el); }

  // ---------- refresh ----------
  var refreshing=false;
  function refreshBrief(){
    if(refreshing) return;
    if(!SERVER.available){ setRefreshStatus('err','Live refresh needs the local app running. Start it with the launcher. The built-in briefing still works.'); return; }
    refreshing=true; var btn=document.getElementById('refreshBtn'), icon=document.getElementById('refreshIcon'); btn.disabled=true; icon.classList.add('spin');
    setRefreshStatus('info','Pulling and summarising articles across all focus areas. This can take up to a minute...');
    function applyData(data){ var clusters=(data&&data.clusters)||{}; var total=0;
      ['a','b','c','d','e','news','x'].forEach(function(k){ var inc=clusters[k]||[]; if(inc.length||k==='news'||k==='x'){ state.brief[k]=inc.map(function(it){ return {id:uid(),area:k,sub:it.sub||'',headline:it.headline,date:it.date||'recent',note:it.note||'',sourceName:it.sourceName||'open source',url:it.url,scope:it.scope||'sa',firstSeenAt:Date.now()}; }); total+=inc.length; } });
      state.lastRefreshed=Date.now(); saveState(); renderTabs(); renderView(); renderLastRefreshed();
      setRefreshStatus(total?'':'info', total?'':'No items returned this pull. Showing the last set.'); if(total) setTimeout(function(){ setRefreshStatus('',''); },4000); }
    function finish(){ refreshing=false; icon.classList.remove('spin'); btn.disabled=false; }
    apiPost('/api/refresh',{custom:state.interests,includeNews:true}).then(function(r){
      if(r.ok){ applyData(r.data); finish(); return; }
      // Older engine still running: fall back to a GET refresh.
      return apiGet('/api/refresh').then(function(d){ applyData(d); finish(); });
    }).catch(function(e){
      apiGet('/api/refresh').then(function(d){ applyData(d); finish(); })
        .catch(function(e2){ setRefreshStatus('err','Could not reach the app engine. If you just updated the app, close the black engine window and relaunch it, then Refresh again.'); finish(); });
    });
  }

  // ---------- init ----------
  state=loadState(); sessionPriorLastViewed=state.lastViewed||0; state.activeTab='all';
  document.getElementById('refreshBtn').addEventListener('click',refreshBrief);
  document.getElementById('docCloseBtn').addEventListener('click',closeDoc);
  document.getElementById('docDownloadBtn').addEventListener('click',downloadDoc);
  document.getElementById('docModal').addEventListener('click',function(e){ if(e.target===this) closeDoc(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDoc(); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') touchLastViewed(); });
  window.addEventListener('beforeunload',touchLastViewed);

  tickClock(); setInterval(tickClock,30000);
  renderTabs(); renderView(); renderLastRefreshed(); renderModeBadge();

  apiGet('/api/health').then(function(h){ SERVER.available=true; SERVER.ai=!!(h&&h.ai); renderModeBadge(); renderTabs(); setTimeout(refreshBrief,300); })
    .catch(function(){ SERVER.available=false; renderModeBadge(); renderTabs(); });

</script>
</body>
</html>
